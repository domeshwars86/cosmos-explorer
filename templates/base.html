<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}{{ page_title or site_name ~ ' — Interactive Galaxy & Solar System Explorer' }}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ page_description or 'A cinematic, interactive journey through our Solar System and the Milky Way galaxy.' }}{% endblock %}">
  <meta name="theme-color" content="#05060c">
  <link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:title" content="{{ page_title or site_name }}">
  <meta property="og:description" content="{{ page_description or site_tagline }}">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23070a14'/%3E%3Ccircle cx='13' cy='12' r='8' fill='%237c8cff'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=Orbitron:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/responsive.css') }}">

  <script type="importmap">
    { "imports": { "three": "{{ url_for('static', filename='js/vendor/three.module.js') }}" } }
  </script>
  <script src="{{ url_for('static', filename='js/core/webgl-check.js') }}"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}" {% block body_attrs %}{% endblock %}>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <div class="bg-stars" aria-hidden="true"></div>
  <canvas id="star-canvas" aria-hidden="true"></canvas>
  <div class="noise-overlay" aria-hidden="true"></div>

  {% include "partials/loading.html" %}
  {% include "partials/nav.html" %}

  <main id="main-content">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}
  {% include "partials/overlays.html" %}

  <script src="{{ url_for('static', filename='js/core/settings.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/starfield.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/mission-hud.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/achievements.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/journal.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/news-tracker.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/keyboard-shortcuts.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/ask-cosmos.js') }}"></script>
  <script src="{{ url_for('static', filename='js/core/debug-overlay.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
