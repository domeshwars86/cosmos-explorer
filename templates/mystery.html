{% extends "base.html" %}
{% block body_class %}page-mystery{% endblock %}
{% block content %}
<section class="section" style="padding-top:calc(var(--nav-height) + 3rem); padding-bottom:6rem;">
  <div class="container" style="max-width:720px;">
    <div class="section-header center reveal">
      <span class="eyebrow">A Short Challenge</span>
      <h1>Identify the Object</h1>
      <p class="text-lead" style="margin-top:0.8rem;">Read the clues, then guess which planet they describe.</p>
    </div>

    <div class="row center gap-sm reveal" style="margin-bottom:1.5rem;">
      <span class="text-muted" style="font-size:0.85rem;">Difficulty:</span>
      <div class="mode-switch" id="mystery-difficulty">
        <button type="button" data-difficulty="easy">Easy</button>
        <button type="button" data-difficulty="medium" class="active">Medium</button>
        <button type="button" data-difficulty="hard">Hard</button>
        <button type="button" data-difficulty="expert">Expert</button>
      </div>
    </div>

    <div class="panel reveal" style="padding:2rem;" id="mystery-panel">
      <div id="mystery-clues" class="stat-grid"></div>
      <div id="mystery-options" class="grid grid-2" style="margin-top:1.5rem; gap:0.8rem;"></div>
      <div id="mystery-result" class="fact-module hidden" style="margin-top:1.5rem;"></div>
      <div class="section-cta">
        <button type="button" class="btn btn-primary" id="mystery-new">New Mystery</button>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_scripts %}
<script type="module" src="{{ url_for('static', filename='js/pages/mystery.js') }}"></script>
{% endblock %}
